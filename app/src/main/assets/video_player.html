<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动流水线视频</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
        }
        
        .cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://gm-itrade-1255882558.cos.ap-guangzhou.myqcloud.com/GM_ITRADE/base/20241029/1339035pqfa6.svg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
            z-index: 10;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            opacity: 0.8;
            z-index: 20;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="cover" id="cover"></div>
        <video id="videoPlayer" autoplay muted loop playsinline>
            <source src="https://gm-itrade-1255882558.cos.ap-guangzhou.myqcloud.com/uploads/video/automaticAssemblyLine.mp4" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
        <div class="loading" id="loading">加载中...</div>
        
<!--        <div class="controls">-->
<!--            <button class="control-btn" onclick="toggleFullscreen()">全屏</button>-->
<!--            <button class="control-btn" onclick="togglePlayPause()">播放/暂停</button>-->
<!--            <button class="control-btn" onclick="toggleMute()">静音</button>-->
<!--        </div>-->
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const loading = document.getElementById('loading');
        const cover = document.getElementById('cover');
        
        video.addEventListener('loadeddata', function() {
            loading.style.display = 'none';
            cover.style.display = 'none';
            video.play();
        });
        
        video.addEventListener('loadstart', function() {
            loading.style.display = 'block';
            cover.style.display = 'block';
        });
        
        video.addEventListener('canplay', function() {
            loading.style.display = 'none';
            cover.style.display = 'none';
        });
        
        video.addEventListener('error', function(e) {
            loading.textContent = '视频加载失败，请重试';
            cover.style.display = 'block';
            console.error('Video loading error:', e);
        });
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        function togglePlayPause() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
        
        function toggleMute() {
            video.muted = !video.muted;
        }
        
        // Disable key capture to allow Android to handle remote control keys
        document.addEventListener('keydown', function(e) {
            // Allow Android to handle directional keys (arrows)
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                return; // Let Android handle these keys
            }
            
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePlayPause();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case 'm':
                case 'M':
                    toggleMute();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    break;
            }
        });

        // Handle visibility changes for video playback control
        let isPageVisible = true;
        
        function handleVisibilityChange() {
            if (document.hidden || !isPageVisible) {
                // Page is hidden - pause video and reset to 0s
                console.log('Video WebView hidden - pausing and resetting');
                video.pause();
                video.currentTime = 0;
            } else {
                // Page is visible - play from beginning
                console.log('Video WebView visible - starting from 0s');
                video.currentTime = 0;
                video.play().catch(e => {
                    console.log('Auto-play prevented:', e);
                    video.muted = true;
                    video.play();
                });
            }
        }

        // Listen for page visibility changes
        document.addEventListener('visibilitychange', handleVisibilityChange);
        
        // Also handle when the webview becomes active/inactive
        window.addEventListener('focus', function() {
            console.log('Video WebView focused');
            isPageVisible = true;
            handleVisibilityChange();
        });
        
        window.addEventListener('blur', function() {
            console.log('Video WebView blurred');
            isPageVisible = false;
            handleVisibilityChange();
        });

        // Initial play when loaded
        video.addEventListener('loadeddata', function() {
            console.log('Video loaded, ready to play');
            if (isPageVisible) {
                video.currentTime = 0;
                video.play().catch(e => {
                    console.log('Auto-play prevented:', e);
                    video.muted = true;
                    video.play();
                });
            }
        });
        
        video.addEventListener('dblclick', toggleFullscreen);
        
        setTimeout(() => {
            const controls = document.querySelector('.controls');
            controls.style.opacity = '0';
            
            document.addEventListener('mousemove', () => {
                controls.style.opacity = '0.8';
                setTimeout(() => {
                    controls.style.opacity = '0';
                }, 3000);
            });
        }, 3000);
        
        try {
            video.play().catch(e => {
                console.log('Auto-play prevented:', e);
                video.muted = true;
                video.play();
            });
        } catch (e) {
            console.log('Video play error:', e);
        }
    </script>
</body>
</html>
